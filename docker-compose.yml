version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./experiments:/app/experiments
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./experiments:/app/experiments
      - ./data:/app/data
    restart: unless-stopped

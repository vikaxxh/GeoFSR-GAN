# Base Configuration for GeoFSR-GAN

project:
  name: "GeoFSR-GAN"
  seed: 42
  device: "auto"  # 'auto', 'cpu', or 'cuda'

dataset:
  name: "SpaceNet_Satellite"
  data_dir: "data/sample_dataset"
  scale: 4
  hr_patch_size: 96
  lr_patch_size: 24
  subset_size: null  # null loads all samples
  num_workers: 0
  pin_memory: false

degradation:
  blur_kernel_size: 7
  blur_sigma_min: 0.2
  blur_sigma_max: 2.0
  use_motion_blur: true
  motion_blur_kernel_size: 5
  noise_type: "gaussian" # 'gaussian', 'poisson', or 'mixed'
  noise_std_max: 0.05
  jpeg_quality_min: 50
  jpeg_quality_max: 95
  color_jitter_prob: 0.3

model:
  scale: 4
  in_channels: 3
  out_channels: 3
  spatial_encoder:
    num_blocks: 4
    num_features: 64
  frequency_encoder:
    wavelet: "haar"
    levels: 1
  fusion:
    type: "concat" # 'concat', 'learned', or 'attention'

training:
  batch_size: 1
  epochs: 10
  lr: 0.0002
  betas: [0.9, 0.999]
  checkpoint_dir: "experiments/base/checkpoints"
  log_dir: "experiments/base/logs"
  save_freq: 5

losses:
  lambda_pixel: 1.0
  lambda_freq: 0.5
  frequency_subband_weights:
    w_ll: 1.0
    w_lh: 2.0
    w_hl: 2.0
    w_hh: 3.0
  lambda_edge: 0.1
  lambda_perceptual: 0.1
  perceptual_mode: "vgg19"
  lambda_seg: 0.0
  lambda_adv_spatial: 0.005
  lambda_adv_frequency: 0.005

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geofsr-gan"
version = "0.1.0"
description = "Frequency-Aware Adversarial Super-Resolution for Satellite Imagery and Downstream Geospatial Analysis"
authors = [{ name = "GeoFSR-GAN Team" }]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "PyWavelets>=1.4.1",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "opencv-python-headless>=4.7.0",
    "PyYAML>=6.0",
    "pytest>=7.3.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.22.0",
    "pydantic>=2.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

